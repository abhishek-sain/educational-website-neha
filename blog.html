<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog | EduSphere</title>
  <meta name="description" content="Educational insights, study tips, and career advice from EduSphere's instructors and team.">
  <link rel="canonical" href="https://www.edusphere.example/blog.html">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <style>
    .blog-layout { display: grid; grid-template-columns: 2.2fr 1fr; gap: var(--space-xl); align-items: start; }
    #featuredBlog { background: var(--color-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); overflow: hidden; margin-bottom: var(--space-lg); }
    .blog-sidebar-card { background: var(--color-surface); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); padding: var(--space-md); margin-bottom: var(--space-md); }
    .search-box { position: relative; margin-bottom: var(--space-md); }
    .search-box input { width: 100%; padding: 0.75rem 1rem 0.75rem 2.6rem; border-radius: var(--radius-sm); border: 1.5px solid var(--color-border); }
    .search-box i { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--color-text-muted); }
    #blogCategoryFilters { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: var(--space-lg); }
    @media (max-width: 1023px) { .blog-layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="breadcrumb-bar">
      <div class="container">
        <h1>EduSphere Blog</h1>
        <nav class="breadcrumb-trail" aria-label="Breadcrumb"><a href="index.html">Home</a> / <span>Blog</span></nav>
      </div>
    </section>

    <section class="section">
      <div class="container blog-layout">
        <div>
          <div id="blogCategoryFilters"></div>
          <article id="featuredBlog"></article>
          <div class="blog-grid" id="blogGrid"></div>
        </div>

        <aside>
          <div class="blog-sidebar-card">
            <div class="search-box">
              <i class="fa-solid fa-magnifying-glass"></i>
              <input type="search" id="blogSearch" placeholder="Search articles...">
            </div>
            <h4 style="margin-bottom:0.8rem;">Popular Articles</h4>
            <ul id="popularArticles"></ul>
          </div>
          <div class="blog-sidebar-card" style="background:var(--gradient-primary);color:#fff;">
            <h4 style="color:#fff;">Weekly Learning Tips</h4>
            <p style="color:rgba(255,255,255,0.85);font-size:0.9rem;">Subscribe for fresh study strategies in your inbox every week.</p>
            <form id="sidebarNewsletterForm" novalidate>
              <input type="email" required placeholder="Your email" class="form-control" style="margin-bottom:0.6rem;">
              <button type="submit" class="btn btn-accent btn-block">Subscribe</button>
            </form>
            <p class="form-feedback" id="sidebarNewsletterFeedback"></p>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/blogs.js"></script>
  <script src="assets/js/forms.js"></script>
  <script src="assets/js/animations.js"></script>
  <script>
    document.addEventListener("edu:ready", () => {
      const form = document.getElementById("sidebarNewsletterForm");
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const input = form.querySelector("input");
        const feedback = document.getElementById("sidebarNewsletterFeedback");
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(input.value)) {
          feedback.textContent = "Please enter a valid email address.";
          feedback.className = "form-feedback error";
          return;
        }
        feedback.textContent = "Subscribed!";
        feedback.className = "form-feedback success";
        EDU.showToast("Thanks for subscribing!", "success");
        form.reset();
      });
    });
  </script>
</body>
</html>
