<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Resources | EduSphere</title>
  <meta name="description" content="Free study notes, PDFs, practice questions, and interview prep resources across programming, data science, mathematics, and more.">
  <link rel="canonical" href="https://www.edusphere.example/resources.html">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <style>
    .resource-toolbar { display: flex; gap: 1rem; margin-bottom: var(--space-md); flex-wrap: wrap; align-items: center; justify-content: space-between; }
    .search-box { position: relative; flex: 1; max-width: 420px; }
    .search-box input { width: 100%; padding: 0.75rem 1rem 0.75rem 2.6rem; border-radius: var(--radius-sm); border: 1.5px solid var(--color-border); }
    .search-box i { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--color-text-muted); }
    #resourceFilters { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: var(--space-md); }
  </style>
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="breadcrumb-bar">
      <div class="container">
        <h1>Study Resources</h1>
        <nav class="breadcrumb-trail" aria-label="Breadcrumb"><a href="index.html">Home</a> / <span>Study Resources</span></nav>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="notice-banner">
          <i class="fa-solid fa-circle-info"></i>
          <span>These are sample demo resources for a static showcase site. Download links point to placeholder files for illustration purposes.</span>
        </div>

        <div class="resource-toolbar">
          <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="search" id="resourceSearch" placeholder="Search resources...">
          </div>
          <select id="resourceTypeFilter" class="form-control" style="width:auto;">
            <option value="All">All Types</option>
          </select>
        </div>

        <div id="resourceFilters"></div>

        <div class="resource-grid" id="resourceGrid"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/forms.js"></script>
  <script src="assets/js/animations.js"></script>
  <script>
    document.addEventListener("edu:ready", () => {
      let state = { search: "", subject: "All", type: "All" };

      const subjects = ["All", ...new Set(EDU_DATA.resources.map(r => r.subject))];
      document.getElementById("resourceFilters").innerHTML = subjects.map(s =>
        `<button class="filter-pill ${s === "All" ? "active" : ""}" data-subject="${s}">${s}</button>`
      ).join("");

      const types = ["All", ...new Set(EDU_DATA.resources.map(r => r.type))];
      document.getElementById("resourceTypeFilter").innerHTML = types.map(t => `<option value="${t}">${t}</option>`).join("");

      const typeIcon = { PDF: "fa-file-pdf", Notes: "fa-note-sticky", "Practice Questions": "fa-list-check", "Interview Prep": "fa-comments", "Previous Papers": "fa-file-lines", Tutorial: "fa-book-open", "Coding Exercises": "fa-code" };

      function render() {
        let list = EDU_DATA.resources.filter(r =>
          (state.subject === "All" || r.subject === state.subject) &&
          (state.type === "All" || r.type === state.type) &&
          (!state.search || r.title.toLowerCase().includes(state.search.toLowerCase()))
        );
        const grid = document.getElementById("resourceGrid");
        grid.innerHTML = list.length ? list.map(r => `
          <div class="resource-card" data-reveal>
            <div class="icon"><i class="fa-solid ${typeIcon[r.type] || "fa-file"}"></i></div>
            <div class="resource-card-body">
              <span class="card-category">${r.subject}</span>
              <h3 style="font-size:1rem;">${r.title}</h3>
              <span class="badge">${r.type}</span>
              <div class="resource-card-foot">
                <span>${r.size} &middot; ${r.downloads.toLocaleString()} downloads</span>
                <a href="${r.file}" class="btn btn-outline btn-sm" download>Download</a>
              </div>
            </div>
          </div>`).join("") : `<p class="text-center" style="grid-column:1/-1;">No resources match your search.</p>`;
        grid.querySelectorAll("[data-reveal]").forEach(el => el.classList.add("in-view"));
      }

      document.getElementById("resourceSearch").addEventListener("input", (e) => { state.search = e.target.value; render(); });
      document.getElementById("resourceTypeFilter").addEventListener("change", (e) => { state.type = e.target.value; render(); });
      document.getElementById("resourceFilters").addEventListener("click", (e) => {
        const btn = e.target.closest(".filter-pill");
        if (!btn) return;
        state.subject = btn.dataset.subject;
        document.querySelectorAll("#resourceFilters .filter-pill").forEach(p => p.classList.remove("active"));
        btn.classList.add("active");
        render();
      });

      render();
    });
  </script>
</body>
</html>
