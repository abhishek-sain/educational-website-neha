<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | EduSphere</title>
  <meta name="description" content="Log in to your EduSphere account to continue learning.">
  <link rel="canonical" href="https://www.edusphere.example/login.html">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="section">
      <div class="container">
        <div class="auth-split">
          <div class="auth-visual">
            <i class="fa-solid fa-graduation-cap" style="font-size:2.4rem;margin-bottom:1rem;"></i>
            <h2>Welcome Back to EduSphere</h2>
            <p>Pick up right where you left off — your courses and progress are waiting.</p>
          </div>
          <div class="auth-form-panel">
            <h1 style="font-size:1.8rem;">Log In</h1>
            <div class="notice-banner">
              <i class="fa-solid fa-circle-info"></i>
              <span>Demo only — this form does not create or access a real account.</span>
            </div>
            <form id="loginForm" novalidate>
              <div class="form-group">
                <label for="loginEmail">Email *</label>
                <input type="email" id="loginEmail" class="form-control" data-rule="email" required placeholder="you@example.com">
                <div class="field-error"></div>
              </div>
              <div class="form-group">
                <label for="loginPassword">Password *</label>
                <div class="password-field">
                  <input type="password" id="loginPassword" class="form-control" data-rule="password" required placeholder="••••••••">
                  <button type="button" class="password-toggle" data-target="loginPassword" aria-label="Toggle password visibility"><i class="fa-regular fa-eye"></i></button>
                </div>
                <div class="field-error"></div>
              </div>
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-md);">
                <label class="checkbox-row"><input type="checkbox" id="rememberMe"> Remember Me</label>
                <a href="#" style="font-size:0.85rem;color:var(--color-primary);font-weight:600;">Forgot Password?</a>
              </div>
              <button type="submit" class="btn btn-primary btn-block">Log In</button>
              <p class="form-feedback" id="loginFormFeedback" style="color:var(--color-text-muted);"></p>
            </form>
            <p style="text-align:center;margin-top:var(--space-md);font-size:0.9rem;">Don't have an account? <a href="register.html" style="color:var(--color-primary);font-weight:600;">Create Account</a></p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/forms.js"></script>
  <script src="assets/js/animations.js"></script>
</body>
</html>
