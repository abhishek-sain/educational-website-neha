<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article | EduSphere Blog</title>
  <meta name="description" content="Read in-depth educational articles from EduSphere's instructors and team.">
  <link rel="canonical" href="https://www.edusphere.example/blog-details.html">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <style>
    .article-body { font-size: 1.05rem; line-height: 1.8; }
    .article-body p { color: var(--color-text); }
  </style>
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
  <div id="articleRoot">
    <section class="breadcrumb-bar">
      <div class="container">
        <span class="badge" id="articleCategory" style="background:rgba(255,255,255,0.18);color:#fff;">Category</span>
        <h1 id="articleTitle" style="margin-top:0.6rem;">Loading article…</h1>
        <nav class="breadcrumb-trail" aria-label="Breadcrumb"><a href="index.html">Home</a> / <a href="blog.html">Blog</a> / <span>Article</span></nav>
      </div>
    </section>

    <section class="section">
      <div class="container article-layout">
        <article>
          <div class="blog-card-meta" style="margin-bottom:var(--space-md);">
            <span><i class="fa-regular fa-user"></i> <span id="articleAuthor"></span></span>
            <span><i class="fa-regular fa-calendar"></i> <span id="articleDate"></span></span>
            <span><i class="fa-regular fa-clock"></i> <span id="articleReadTime"></span></span>
          </div>
          <img id="articleImage" src="" alt="" loading="lazy" style="width:100%;border-radius:var(--radius-md);box-shadow:var(--shadow-md);">
          <div class="article-body" id="articleContent"></div>

          <div class="share-row">
            <span style="font-weight:600;align-self:center;margin-right:0.3rem;">Share:</span>
            <a href="#" aria-label="Share on Facebook"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#" aria-label="Share on Twitter"><i class="fa-brands fa-x-twitter"></i></a>
            <a href="#" aria-label="Share on LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
            <a href="#" aria-label="Share via Email"><i class="fa-regular fa-envelope"></i></a>
          </div>

          <div class="article-nav" id="articleNav"></div>
        </article>

        <aside>
          <div class="toc-card">
            <h4 style="margin-bottom:0.6rem;">Table of Contents</h4>
            <ul id="tableOfContents"></ul>
          </div>
        </aside>
      </div>
    </section>

    <section class="section" style="background:var(--color-surface);">
      <div class="container">
        <div class="section-head"><span class="eyebrow">Keep Reading</span><h2>Related Articles</h2></div>
        <div class="blog-grid" id="relatedArticles"></div>
      </div>
    </section>
  </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/blogs.js"></script>
  <script src="assets/js/forms.js"></script>
  <script src="assets/js/animations.js"></script>
</body>
</html>
