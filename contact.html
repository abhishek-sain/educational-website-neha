<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | EduSphere</title>
  <meta name="description" content="Get in touch with EduSphere's support and advisory team for questions about courses, programs, and enrollment.">
  <link rel="canonical" href="https://www.edusphere.example/contact.html">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="breadcrumb-bar">
      <div class="container">
        <h1>Contact Us</h1>
        <nav class="breadcrumb-trail" aria-label="Breadcrumb"><a href="index.html">Home</a> / <span>Contact</span></nav>
      </div>
    </section>

    <section class="section">
      <div class="container contact-grid">
        <div data-reveal>
          <div class="contact-info-card">
            <div class="icon"><i class="fa-regular fa-envelope"></i></div>
            <div><strong>Email Us</strong><p style="margin:0;">support@edusphere.example</p></div>
          </div>
          <div class="contact-info-card">
            <div class="icon"><i class="fa-solid fa-phone"></i></div>
            <div><strong>Call Us</strong><p style="margin:0;">+1 (555) 012-3456</p></div>
          </div>
          <div class="contact-info-card">
            <div class="icon"><i class="fa-solid fa-location-dot"></i></div>
            <div><strong>Visit Us</strong><p style="margin:0;">120 Learning Lane, Suite 400, Austin, TX 73301</p></div>
          </div>
          <div class="map-embed" role="img" aria-label="Map placeholder showing EduSphere office location">
            <i class="fa-solid fa-map-location-dot" style="font-size:2rem;margin-right:0.5rem;"></i> Map embed placeholder
          </div>
        </div>

        <div data-reveal="fade">
          <div class="notice-banner">
            <i class="fa-solid fa-circle-info"></i>
            <span>This is a static demo site. Form submissions are simulated locally and are not sent to a real server.</span>
          </div>
          <form id="contactForm" novalidate>
            <div class="form-row">
              <div class="form-group">
                <label for="contactName">Full Name *</label>
                <input type="text" id="contactName" class="form-control" data-rule="name" required placeholder="Jane Doe">
                <div class="field-error"></div>
              </div>
              <div class="form-group">
                <label for="contactEmail">Email *</label>
                <input type="email" id="contactEmail" class="form-control" data-rule="email" required placeholder="jane@example.com">
                <div class="field-error"></div>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="contactPhone">Phone</label>
                <input type="tel" id="contactPhone" class="form-control" data-rule="phone" placeholder="+1 555 123 4567">
                <div class="field-error"></div>
              </div>
              <div class="form-group">
                <label for="contactSubject">Subject *</label>
                <input type="text" id="contactSubject" class="form-control" data-rule="name" required placeholder="Course inquiry">
                <div class="field-error"></div>
              </div>
            </div>
            <div class="form-group">
              <label for="contactMessage">Message *</label>
              <textarea id="contactMessage" class="form-control" data-rule="message" required placeholder="How can we help?"></textarea>
              <div class="field-error"></div>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Send Message</button>
            <p class="form-feedback" id="contactFormFeedback" style="color:var(--color-text-muted);"></p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/forms.js"></script>
  <script src="assets/js/animations.js"></script>
</body>
</html>
